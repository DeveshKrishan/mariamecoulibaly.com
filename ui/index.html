<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Space Mono (body) matches the reference site's body font exactly.
      Space Grotesk (headings) is a free stand-in for the reference site's
      "Gopher" heading font, which is a paid Adobe Fonts kit locked to their
      domain. It's from the same "Space" family as Space Mono, so it pairs
      well and keeps a similar geometric/quirky feel.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Static fallback for OG/Twitter crawlers (Facebook, Slack, iMessage,
      etc.) that don't execute JS, so a link shared before route-specific
      tags (see src/components/seo/Seo.tsx) render still gets a sensible
      preview. React doesn't know about these pre-existing tags, so each one
      is marked `data-seo-fallback` and removed by Seo.tsx the moment a
      route-specific <Seo> mounts, to avoid duplicate title/meta elements.
    -->
    <title data-seo-fallback>Mariam Coulibaly</title>
    <meta
      data-seo-fallback
      name="description"
      content="Portfolio of Mariam Coulibaly, an emerging media professional from the San Francisco Bay Area."
    />
    <meta data-seo-fallback property="og:type" content="website" />
    <meta data-seo-fallback property="og:site_name" content="Mariam Coulibaly" />
    <meta data-seo-fallback property="og:title" content="Mariam Coulibaly" />
    <meta
      data-seo-fallback
      property="og:description"
      content="Portfolio of Mariam Coulibaly, an emerging media professional from the San Francisco Bay Area."
    />
    <meta
      data-seo-fallback
      property="og:url"
      content="https://mariamecoulibaly-com-ui.vercel.app/"
    />
    <meta data-seo-fallback name="twitter:card" content="summary_large_image" />
    <meta data-seo-fallback name="twitter:title" content="Mariam Coulibaly" />
    <meta
      data-seo-fallback
      name="twitter:description"
      content="Portfolio of Mariam Coulibaly, an emerging media professional from the San Francisco Bay Area."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
