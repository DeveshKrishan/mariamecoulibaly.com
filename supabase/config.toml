# Minimal Supabase CLI config for local Postgres + migrations.
# Requires Docker Desktop (or compatible engine) for `supabase start`.
# See docs/PLAN.md Section 9 and api/README.md.

project_id = "mariamecoulibaly"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
